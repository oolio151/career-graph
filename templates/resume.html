<div class="view" id="view-resume" hidden>
  <div class="resume-editor">
    <section class="resume-chat" aria-label="Resume chat">
      <div class="resume-chat-head">
        <h1>Shape the resume.</h1>
        <p>Ask about a section. Replies use your courses and alumni first jobs.</p>
        <p class="advisor-engine"><span id="advisor-engine-dot" class="engine-dot"></span><span id="advisor-engine">Checking advisor…</span></p>
      </div>
      <div id="resume-messages" role="log" aria-live="polite" aria-relevant="additions"></div>
      <div class="resume-prompts">
        <button type="button" data-resume-prompt="What should I add?">What should I add?</button>
        <button type="button" data-resume-prompt="How does this compare with alumni jobs?">Compare with alumni jobs</button>
        <button type="button" data-resume-prompt="Which of my experiences should I describe?">Which experience should I expand?</button>
      </div>
      <form id="resume-chat-form">
        <label class="sr-only" for="resume-chat-input">Message the resume chat</label>
        <input id="resume-chat-input" maxlength="500" placeholder="Ask about a section" autocomplete="off" required>
        <button class="primary-button" type="submit" aria-label="Send message">Send</button>
      </form>
      <p class="resume-chat-note" id="resume-chat-note">Grounded in synthetic alumni records. Not a promise about hiring.</p>
    </section>
    <section class="resume-stage" aria-label="Your resume">
      <div class="resume-stage-bar">
        <div>
          <h2 id="resume-filename">Resume</h2>
          <p id="resume-file-note" class="field-hint"></p>
        </div>
        <a class="secondary-button" href="/api/resume">Download</a>
      </div>
      <div id="resume-canvas"></div>
    </section>
  </div>
</div>
