<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="csrf-token" content="{{ session['csrf'] }}" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#387e7d" />
    <meta
      name="description"
      content="Explore the connections between your degree, campus experiences, and your next career chapter."
    />
    <title>
      {% block title %}Career Graph — Find your next chapter{% endblock %}
    </title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css', v=5) }}"
    />
    {% block scripts %}<script src="{{ url_for('static', filename='js/main.js', v=5) }}" defer></script>
    <script src="{{ url_for('static', filename='js/discover.js', v=5) }}" defer></script>
    <script src="{{ url_for('static', filename='js/resume.js', v=5) }}" defer></script>{% endblock %}
  </head>
  <body data-student-id="{{ student_id|default('') }}">
    <a class="skip-link" href="#main">Skip to content</a>
    {% block content %}{% endblock %}
  </body>
</html>
